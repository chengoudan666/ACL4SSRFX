;================ 节点名称净化（可自由增删）================
; 格式：rename=匹配的正则@替换内容（@ 后留空 = 直接删除）
; 多行 rename 按从上到下顺序依次应用，每行对节点名中所有匹配处生效
rename=公益@
rename=哄哄@
rename=交流群组@
rename=@honghongll@
rename=通知频道@
rename=请勿滥用@
rename=@honghongtg@
; 去掉 tg / TG / Tg（要求前后不紧跟英文字母或数字，避免误删 TGC 之类单词）
rename=(?i)(?<![a-z0-9])tg(?![a-z0-9])@
; 若删字眼后留下空括号（如 "美国(公益)"→"美国()"），下面两行去掉空括号
rename=\(\s*\)@
rename=（\s*）@
; 清理删除后残留的多余分隔符/空格（如 "日本-公益-5x"→"日本-5x"）
rename=-{2,}@-
rename=_{2,}@_
rename=[ ]{2,}@
; 还有别的字眼要删，照上面格式加行即可，例如：
; rename=免费@
; rename=限时@

; 最后统一给所有节点名前加 ✨狗蛋✨ 前缀
; （放在最后，保证删字/清理完成后前缀仍完整留在名字最前面）
rename=^@✨狗蛋✨
;============================================================

